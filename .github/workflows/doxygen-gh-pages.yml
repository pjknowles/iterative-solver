name: Build doxygen pages and publish to github pages

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Container image tag to build in place of latest, such as a branch name that docker-publish.yml has published"
        required: false
        default: latest
  push:
    branches:
      - master

# Overlapping runs race on pushing to gh-pages, so queue them instead
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      # relies on repository name being all lower case
      image: ghcr.io/${{ github.repository }}:${{ inputs.image-tag || 'latest' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build

      - name: Build
        run: |
          git config --global --add safe.directory ${{github.workspace}}
          cmake --build ${{github.workspace}}/build --target DependencyManagerDocs
          rsync -av ${{github.workspace}}/build/docs/${{ github.event.repository.name }}/html .
          mkdir -p html/DoxygenTagFiles
          find ${{github.workspace}}/build/docs -name '*.tag' -exec cp {} html/DoxygenTagFiles \;
          find ${{github.workspace}}/build/docs -name 'iostream*.html' -exec cat {} \;
          ls -ltRa html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./html
