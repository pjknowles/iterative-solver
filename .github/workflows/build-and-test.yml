name: Build and test

on:
  push:
    branches: [ "main" , "master"]
  pull_request:
    branches: [ "main" , "master"]
  workflow_dispatch:

env:
  CMAKE_BUILD_TYPE: Release
  AUTOCONF_TEST_TARGET:

jobs:

  cmake-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    # ccache is in the image. Only C and C++ go through it: ccache does not
    # support Fortran. Source and build paths are the same on every run, so
    # cached objects (debug info included) are reusable as they stand. A fixed
    # path, because in a container job github.workspace names the host's path.
    env:
      CCACHE_DIR: /tmp/ccache
      CCACHE_MAXSIZE: 400M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # OpenMPI refuses to start more processes than the container has CPUs, which
      # fails every _3procs test. MPICH ignores this.
      PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
    container:
      # relies on repository name being all lower case
      image: ghcr.io/${{ github.repository }}:latest${{ matrix.image }}
#      credentials:
#        username: ${{ github.actor }}
#        password: ${{ secrets.GITHUB_TOKEN }}
#    defaults:
#      run:
#        shell: bash -el {0}
    strategy:
      # One configuration failing should not cancel the others: the point of a
      # matrix is to learn which configurations are broken, not just that one is.
      fail-fast: false
      matrix:
        # image is the tag suffix from docker-publish.yml. Most configurations run in
        # the all-Debian images, where compilers and libraries come from one package
        # manager. The conda image ("") keeps only what Debian does not provide.
        include:
          - image: -debian-mpich
            cmake-options: ""
          - image: -debian-mpich
            cmake-options: "-DFORTRAN_INTEGER8=OFF"
          - image: -debian-mpich
            cmake-options: "-DCMAKE_Fortran_FLAGS=-std=f2023"
          # clang is installed in the image but was never used, so clang-only
          # errors reached review (#593).
          # CMake scans C++20 sources for modules with clang-scan-deps, which
          # Debian's clang package does not include. The project has no modules.
          - image: -debian-mpich
            cmake-options: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_SCAN_FOR_MODULES=OFF"
          # The serial build. Fortran needs MPI, so it has to come off too.
          - image: -debian-mpich
            cmake-options: "-DMPI=OFF -DFORTRAN=OFF"
          # MPI_Comm is an int in MPICH and a pointer in OpenMPI, so communicator
          # handle conversion can pass under one and fail under the other.
          - image: -debian-openmpi
            cmake-options: ""
          - image: -debian-openmpi
            cmake-options: "-DFORTRAN_INTEGER8=OFF"
          # Debian's own BLAS/LAPACK is the reference implementation, so the
          # vendor-specific builds stay in the conda image. #656 was an MKL-only bug.
          - image: ""
            cmake-options: "-DBLA_VENDOR=OpenBLAS"
          - image: ""
            cmake-options: "-DBLA_VENDOR=Intel10_64lp_seq"

    steps:
    - uses: actions/checkout@v5
    - name: Check existence of build configuration file
      id: check_configuration
      uses: andstor/file-existence-action@v3
      with:
        files: "CMakeLists.txt"

    - name: Restore the compiler cache
      uses: actions/cache/restore@v4
      with:
        path: /tmp/ccache
        key: ccache-cmake-build-${{ strategy.job-index }}-${{ github.sha }}
        restore-keys: ccache-cmake-build-${{ strategy.job-index }}-

    - name: Configure CMake
      if: steps.check_configuration.outputs.files_exists == 'true'
      run: cmake -B ${{github.workspace}}/build -DCMAKE_CXX_FLAGS=-fpermissive -DCMAKE_BUILD_TYPE=${{env.CMAKE_BUILD_TYPE}} ${{ matrix.cmake-options }}

    # The container is pinned, but the conda and apt packages inside it are resolved
    # when the image is built, so record what this run actually used. Without this the
    # numerical library behind a failure cannot be identified after the fact.
    - name: Record the toolchain
      if: steps.check_configuration.outputs.files_exists == 'true'
      run: |
        cmake --version | head -1
        grep -E '^CMAKE_(C|CXX|Fortran)_COMPILER:' ${{github.workspace}}/build/CMakeCache.txt || true
        gfortran --version | head -1 || true
        conda list 2>/dev/null | grep -E '^(mkl|openblas|libblas|liblapack|numpy|gcc|gfortran)' || true
        grep -E '^(BLAS|LAPACK)[A-Za-z_]*:' ${{github.workspace}}/build/CMakeCache.txt || true

    - name: Build
      if: steps.check_configuration.outputs.files_exists == 'true'
      run: cmake --build ${{github.workspace}}/build --config ${{env.CMAKE_BUILD_TYPE}}

    - name: Compiler cache statistics
      if: always()
      run: ccache --show-stats

    # Saved even when the build fails: the objects that did compile are still
    # good, and a broken build is exactly when the next push wants a fast rebuild.
    - name: Save the compiler cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: /tmp/ccache
        key: ccache-cmake-build-${{ strategy.job-index }}-${{ github.sha }}

    - name: Test
      if: steps.check_configuration.outputs.files_exists == 'true'
      # A known RMA failure in the Debian MPICH image, skipped there only until it is
      # fixed (#670). mpiexec passes this to every rank.
      env:
        GTEST_FILTER: ${{ matrix.image == '-debian-mpich' && '-GA/DistrArrayRangeRMAF/*' || '*' }}
      run: cd ${{github.workspace}}/build && ctest -C ${{env.CMAKE_BUILD_TYPE}} --output-on-failure
    - name: Build doxygen
      run: cmake --build ${{github.workspace}}/build --target DependencyManagerDocs

  # The container image is x86-64 Linux only, so these jobs install their own
  # dependencies. They build the serial C++ library: Fortran needs MPI here
  # (MPI=OFF with Fortran on is a fatal error) and neither runner has it.
  # Together with the container job this covers all three long double ABIs --
  # 80-bit on x86-64, binary128 on aarch64 Linux, binary64 on macOS arm64 --
  # which is the axis that broke four tests in #590, found by hand rather than
  # by CI.
  portability:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    # As in the container jobs. Here the compiler is checked by its reported
    # version, not its file: these runners swap toolchains under a fixed label,
    # and on macOS /usr/bin/c++ is an xcrun shim whose file never changes when
    # the Xcode behind it does. CCACHE_DIR is set in the first step, because the
    # runner context (runner.temp) is not available in job-level env.
    env:
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: "%compiler% --version"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS arm64 (AppleClang, Accelerate)"
            runs-on: macos-14
          - name: "Linux aarch64 (gcc)"
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Locate the compiler cache
        run: echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen lapack ccache

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev liblapacke-dev ccache

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.runs-on }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.runs-on }}-

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMPI=OFF -DFORTRAN=OFF

      # The compiler version, not just its path: these runners change their
      # command-line tools under a fixed label, and without the version a result
      # that flips cannot be explained afterwards.
      - name: Record the toolchain
        run: |
          cmake --version | head -1
          c++ --version | head -2
          sw_vers 2>/dev/null || true
          grep -E '^CMAKE_(C|CXX)_COMPILER:' build/CMakeCache.txt || true
          grep -E '^(BLAS|LAPACK)[A-Za-z_]*:' build/CMakeCache.txt || true

      - name: Build
        run: cmake --build build

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      # Saved even when the build fails: the objects that did compile are still
      # good, and a broken build is exactly when the next push wants a fast rebuild.
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.runs-on }}-${{ github.sha }}

      - name: Test
        run: cd build && ctest --output-on-failure

  # #656 was a heap overflow that reached master, and nothing in CI would have
  # caught it. Leak detection is off: the profiler singleton and the numerical
  # libraries are not expected to be leak-clean at exit.
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ccache is in the image. Only C and C++ go through it: ccache does not
    # support Fortran. Source and build paths are the same on every run, so
    # cached objects (debug info included) are reusable as they stand. A fixed
    # path, because in a container job github.workspace names the host's path.
    env:
      CCACHE_DIR: /tmp/ccache
      CCACHE_MAXSIZE: 400M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    container:
      image: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-sanitizers-${{ github.sha }}
          restore-keys: ccache-sanitizers-

      - name: Configure CMake
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMPI=OFF -DFORTRAN=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j 2

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      # Saved even when the build fails: the objects that did compile are still
      # good, and a broken build is exactly when the next push wants a fast rebuild.
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-sanitizers-${{ github.sha }}

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: cd build && ctest --output-on-failure
