name: Docker build and publish

on:
  push:
    paths:
      - Dockerfile
      - Dockerfile.debian
      - python/requirements.txt
      - .github/workflows/docker-publish.yml
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The conda image keeps the unsuffixed tags, so existing jobs are unaffected.
          - name: conda
            dockerfile: Dockerfile
            build-args: ""
            suffix: ""
          - name: debian-mpich
            dockerfile: Dockerfile.debian
            build-args: MPI_FLAVOUR=mpich
            suffix: "-debian-mpich"
          - name: debian-openmpi
            dockerfile: Dockerfile.debian
            build-args: MPI_FLAVOUR=openmpi
            suffix: "-debian-openmpi"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The suffix is given per tag rather than through flavor, so that each tag
          # says exactly what it publishes.
          # Only master moves the latest tags, which every CI job uses. Any other branch
          # publishes under its own name, to be tried through build-and-test's image-tag
          # input before it is merged.
          tags: |
            type=ref,event=branch,suffix=${{ matrix.suffix }}
            type=ref,event=pr,suffix=${{ matrix.suffix }}
            type=raw,value=latest${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}