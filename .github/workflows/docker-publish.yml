name: Docker build and publish

on:
  push:
    paths:
      - Dockerfile
      - Dockerfile.debian
      - python/requirements.txt
      - .github/workflows/docker-publish.yml
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The conda image keeps the unsuffixed tags, so existing jobs are unaffected.
          - name: conda
            dockerfile: Dockerfile
            build-args: ""
            suffix: ""
          - name: debian-mpich
            dockerfile: Dockerfile.debian
            build-args: MPI_FLAVOUR=mpich
            suffix: "-debian-mpich"
          - name: debian-openmpi
            dockerfile: Dockerfile.debian
            build-args: MPI_FLAVOUR=openmpi
            suffix: "-debian-openmpi"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@79abd3f86f79a9d68a23c75a09a9a85889262adf

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The suffix is given per tag, not as a flavor: this pinned metadata-action
          # predates flavor's onlatest, and reads "-x,onlatest=true" as the suffix
          # itself, which then splits into a stray "onlatest" tag on docker.io.
          tags: |
            type=ref,event=branch,suffix=${{ matrix.suffix }}
            type=ref,event=pr,suffix=${{ matrix.suffix }}
            type=raw,value=latest${{ matrix.suffix }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}