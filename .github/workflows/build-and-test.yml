name: Build and test

on:
  push:
    branches: [ "main" , "master"]
  pull_request:
    branches: [ "main" , "master"]
  workflow_dispatch:

env:
  CMAKE_BUILD_TYPE: Release
  AUTOCONF_TEST_TARGET:

jobs:

  cmake-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    container:
      # relies on repository name being all lower case
      image: ghcr.io/${{ github.repository }}
#      credentials:
#        username: ${{ github.actor }}
#        password: ${{ secrets.GITHUB_TOKEN }}
#    defaults:
#      run:
#        shell: bash -el {0}
    strategy:
      matrix:
        cmake-options:
          - ""
          - "-DFORTRAN_INTEGER8=OFF"
          - "-DCMAKE_Fortran_COMPILER=/opt/conda/bin/gfortran -DCMAKE_Fortran_FLAGS=-std=f2023"

    steps:
    - uses: actions/checkout@v5
    - name: Check existence of build configuration file
      id: check_configuration
      uses: andstor/file-existence-action@v3
      with:
        files: "CMakeLists.txt"

#    - name: ccache
#      uses: hendrikmuhs/ccache-action@v1.2

    - name: Configure CMake
      if: steps.check_configuration.outputs.files_exists == 'true'
      run: cmake -B ${{github.workspace}}/build -DCMAKE_CXX_FLAGS=-fpermissive -DCMAKE_BUILD_TYPE=${{env.CMAKE_BUILD_TYPE}} ${{ matrix.cmake-options }} # -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    # The container is pinned, but the conda and apt packages inside it are resolved
    # when the image is built, so record what this run actually used. Without this the
    # numerical library behind a failure cannot be identified after the fact.
    - name: Record the toolchain
      if: steps.check_configuration.outputs.files_exists == 'true'
      run: |
        cmake --version | head -1
        g++ --version | head -1
        gfortran --version | head -1
        conda list 2>/dev/null | grep -E '^(mkl|openblas|libblas|liblapack|numpy|gcc|gfortran)' || true
        grep -E '^(BLAS|LAPACK)[A-Za-z_]*:' ${{github.workspace}}/build/CMakeCache.txt || true

    - name: Build
      if: steps.check_configuration.outputs.files_exists == 'true'
      run: cmake --build ${{github.workspace}}/build --config ${{env.CMAKE_BUILD_TYPE}}

    - name: Test
      if: steps.check_configuration.outputs.files_exists == 'true'
      run: cd ${{github.workspace}}/build && ctest -C ${{env.CMAKE_BUILD_TYPE}} --output-on-failure
    - name: Build doxygen
      run: cmake --build ${{github.workspace}}/build --target DependencyManagerDocs
